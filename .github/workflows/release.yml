name: Release

# Push a tag like v0.2.0 to build a .dmg and attach it to a GitHub Release.
# "Run workflow" (manual) builds the .dmg as a run artifact only, without a release.
#
# Signing is automatic once these repository secrets exist; without them the app is ad-hoc signed.
#   MACOS_CERT_P12        base64 of a "Developer ID Application" certificate exported as .p12
#   MACOS_CERT_PASSWORD   the .p12 password
# Notarization additionally needs an App Store Connect API key:
#   APPLE_API_KEY_P8      base64 of the AuthKey_XXXX.p8 file
#   APPLE_API_KEY_ID      its key ID
#   APPLE_API_ISSUER_ID   the issuer ID shown on the App Store Connect keys page

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # create the release

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "Version $v · signing: $HAS_CERT · notarization: $HAS_NOTARY"

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m1 'Developer ID Application' | sed -E 's/.*"(.+)"/\1/')"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::No 'Developer ID Application' identity in the certificate. Other certificate types can't be notarized."
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build app (universal)
        run: UNIVERSAL=1 scripts/make-app.sh

      - name: Build dmg
        run: scripts/make-dmg.sh

      - name: Notarize and staple
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          DMG="build/ReviewBar-${VERSION}.dmg"
          xcrun notarytool submit "$DMG" --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"
          rm -f "$KEY"

      - name: Checksum
        run: |
          cd build
          shasum -a 256 "ReviewBar-${VERSION}.dmg" > "ReviewBar-${VERSION}.dmg.sha256"
          cat "ReviewBar-${VERSION}.dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ReviewBar-${{ env.VERSION }}
          path: |
            build/ReviewBar-${{ env.VERSION }}.dmg
            build/ReviewBar-${{ env.VERSION }}.dmg.sha256
          retention-days: 30

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$HAS_CERT" == "true" && "$HAS_NOTARY" == "true" ]]; then
            NOTE="Signed with Developer ID and notarized by Apple: open the .dmg and drag ReviewBar to Applications."
          elif [[ "$HAS_CERT" == "true" ]]; then
            NOTE="Signed with Developer ID but not notarized: right-click › Open the first time."
          else
            NOTE="Ad-hoc signed (no Developer ID yet): after copying to Applications, right-click › Open the first time, or run: xattr -dr com.apple.quarantine /Applications/ReviewBar.app"
          fi
          gh release create "$GITHUB_REF_NAME" \
            "build/ReviewBar-${VERSION}.dmg" "build/ReviewBar-${VERSION}.dmg.sha256" \
            --title "ReviewBar ${VERSION}" --generate-notes --notes "$NOTE"

      - name: Remove signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true
